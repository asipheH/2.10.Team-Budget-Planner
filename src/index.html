<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Team Budget Planner</title>
</head>

<body>

    <div class="container">

        <header>
            <h1>Team Budget Planner</h1>

            <p>
                Manage vendor deals and calculate
                your team's annual budget.
            </p>
        </header>


        <!-- Team Budget -->

        <section class="budget-card">

            <h2>Team Budget</h2>

            <form id="budget-form">

                <div class="form-group">

                    <label for="team-name">
                        Team Name
                    </label>

                    <input
                        type="text"
                        id="team-name"
                        placeholder="Enter team name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="annual-budget">
                        Annual Budget
                    </label>

                    <input
                        type="number"
                        id="annual-budget"
                        min="0"
                        step="0.01"
                        placeholder="Enter annual budget"
                        required
                    >

                </div>


                <button type="submit">
                    Set Budget
                </button>

            </form>

        </section>


        <!-- Vendor Deal -->

        <section class="deal-card">

            <h2>Add Vendor Deal</h2>

            <form id="deal-form">

                <div class="form-group">

                    <label for="vendor-name">
                        Vendor Name
                    </label>

                    <input
                        type="text"
                        id="vendor-name"
                        placeholder="e.g. Microsoft"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="deal-description">
                        Description
                    </label>

                    <input
                        type="text"
                        id="deal-description"
                        placeholder="e.g. Software licenses"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="deal-amount">
                        Annual Cost
                    </label>

                    <input
                        type="number"
                        id="deal-amount"
                        min="0"
                        step="0.01"
                        placeholder="Enter annual cost"
                        required
                    >

                </div>


                <button type="submit">
                    Add Deal
                </button>

            </form>

        </section>


        <!-- Summary -->

        <section class="summary">

            <h2>Budget Summary</h2>

            <div class="summary-grid">

                <div class="summary-box">

                    <span>Team</span>

                    <strong id="display-team">
                        Not Set
                    </strong>

                </div>


                <div class="summary-box">

                    <span>Annual Budget</span>

                    <strong id="display-budget">
                        R0.00
                    </strong>

                </div>


                <div class="summary-box">

                    <span>Total Expenses</span>

                    <strong id="display-expenses">
                        R0.00
                    </strong>

                </div>


                <div class="summary-box">

                    <span>Remaining Budget</span>

                    <strong id="display-remaining">
                        R0.00
                    </strong>

                </div>

            </div>

        </section>


        <!-- Deals -->

        <section class="deals">

            <h2>Vendor Deals</h2>

            <div id="empty-message">
                No vendor deals have been added.
            </div>


            <table id="deal-table">

                <thead>

                    <tr>
                        <th>Vendor</th>
                        <th>Description</th>
                        <th>Annual Cost</th>
                        <th>Action</th>
                    </tr>

                </thead>


                <tbody id="deal-list"></tbody>

            </table>

        </section>


        <section id="message"></section>

    </div>

</body>
</html>
